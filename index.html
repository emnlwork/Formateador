<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Andrea · Formateador Inteligente</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSC4jjigaiczidV6ksY9V6JL77Fgu8QJwO_RZV2dQ2FSagWw-DGMj2_SO7WGAxO2GbLxjLTtvk0DJTF60ljsw&s&ec=121643154">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">
    <div class="logo-container">
        <img src="https://cdn.freelogovectors.net/wp-content/uploads/2021/06/andrea-logo-freelogovectors.net_.png" alt="Andrea" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <span class="logo-fallback">ANDREA</span>
    </div>

    <!-- ========== NOTAS CON PESTAÑAS ========== -->
    <div class="notes-container" style="border:1px solid var(--blu); border-radius:6px; padding:0.5rem; background:rgba(0,0,0,0.08); margin-bottom:0.5rem;">
        <div style="display:flex; gap:0.3rem; border-bottom:1px solid var(--blub); padding-bottom:0.3rem; margin-bottom:0.3rem; flex-wrap:wrap; align-items:center;">
            <div id="notesTabsContainer" style="display:flex; gap:0.2rem; flex-wrap:wrap;"></div>
            <button id="addNoteTabBtn" style="background:var(--rr); border:1px solid var(--rr); color:white; padding:0.1rem 0.5rem; border-radius:3px; font-size:0.65rem; cursor:pointer; display:inline-flex; align-items:center; gap:0.2rem;">
                <i class="fas fa-plus"></i> Nueva
            </button>
        </div>
        <div id="notesPanelsContainer" style="width:100%;"></div>
        <div style="display:flex; gap:0.3rem; margin-top:0.3rem; flex-wrap:wrap; align-items:center;">
            <button id="normalizeNoteBtn" style="font-size:0.65rem; padding:0.1rem 0.5rem; background:#2ecc71; border-color:#2ecc71; color:#000;"><i class="fas fa-magic"></i> Normalizar</button>
            <button id="copyNoteBtn" style="font-size:0.65rem; padding:0.1rem 0.5rem; background:#3498db; border-color:#3498db; color:white;"><i class="fas fa-copy"></i> Copiar</button>
            <button id="downloadNoteBtn" style="font-size:0.65rem; padding:0.1rem 0.5rem; background:#ffa500; border-color:#ffa500; color:white;"><i class="fas fa-download"></i> Descargar</button>
            <span style="font-size:0.6rem; color:var(--grayl); margin-left:0.3rem;">|</span>
            <label style="font-size:0.6rem; color:var(--grayl); display:inline-flex; align-items:center; gap:0.2rem;">
                <i class="fas fa-columns"></i> Columnas:
                <input type="text" id="columnRangeInput" value="*" placeholder="* o 1-5 o 1,3" style="width:70px; font-size:0.6rem; padding:0.1rem 0.3rem; background:var(--blud); color:white; border:1px solid var(--blu); border-radius:3px;">
            </label>
            <select id="filterSelect" style="font-size:0.6rem; padding:0.1rem 0.3rem; background:var(--blud); color:white; border:1px solid var(--blu); border-radius:3px;">
                <option value="__custom__">Personalizado</option>
            </select>
            <button id="applyRangeBtn" style="font-size:0.6rem; padding:0.1rem 0.4rem; background:#8b00ff; border-color:#8b00ff; color:white;"><i class="fas fa-filter"></i> Aplicar</button>
            <button id="syncNoteBtn" style="font-size:0.6rem; padding:0.1rem 0.4rem; background:#2ecc71; border-color:#2ecc71; color:#000;"><i class="fas fa-cloud-upload-alt"></i> Sync</button>
            <button id="reloadNoteBtn" style="font-size:0.6rem; padding:0.1rem 0.4rem; background:#f1c40f; border-color:#f1c40f; color:#000;"><i class="fas fa-sync-alt"></i> Recargar</button>
            <span id="notesFeedback" style="font-size:0.6rem; color:var(--grayl); margin-left:0.3rem;"></span>
        </div>
    </div>

    <div style="display:flex; justify-content: space-between; align-items: center; flex-wrap:wrap; gap:0.5rem;">
        <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
            <h1 style="border:none; padding-bottom:0; margin:0; font-size:1.5rem;"><i class="fas fa-file-csv"></i> Formateador · Procesamiento inteligente</h1>
            <span style="font-size:0.7rem; color:var(--grayl); background:rgba(0,0,0,0.3); padding:0.1rem 0.5rem; border-radius:3px; border:1px solid var(--blu);">
                <i class="fas fa-cube"></i> Core v<span id="coreVersionDisplay">3.3</span>
            </span>
        </div>
        <div class="header-right">
            <div class="version-info" id="versionInfo" style="cursor:pointer;">
                <i class="fas fa-code-branch"></i> <span id="versionNumber">v2.0.0</span>
                <i class="fas fa-info-circle"></i>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="tab1"><i class="fas fa-calculator"></i> Procesar / Operar</button>
        <button class="tab-btn" data-tab="tab2"><i class="fas fa-not-equal"></i> Diferencias Folios</button>
        <button class="tab-btn" data-tab="tab3"><i class="fas fa-map-pin"></i> Ubicaciones</button>
        <button class="tab-btn" data-tab="tab4"><i class="fas fa-truck"></i> Arribo/Recibir</button>
        <button class="tab-btn" data-tab="tab5"><i class="fas fa-balance-scale"></i> Compensación Diferencias</button>
        <button class="tab-btn" data-tab="tab6"><i class="fas fa-warehouse"></i> Posiciones en Stock</button>
        <button class="tab-btn" data-tab="tab7"><i class="fas fa-boxes"></i> Contenedores</button>
        <button class="tab-btn" data-tab="tab9"><i class="fas fa-barcode"></i>Depurador VR</button>
        <button class="tab-btn" data-tab="tab10"><i class="fas fa-layer-group"></i>Seccionador</button>
        <!-- Módulo 9 oculto -->
    </div>

    <div id="tab1" class="panel active"></div>
    <div id="tab2" class="panel"></div>
    <div id="tab3" class="panel"></div>
    <div id="tab4" class="panel"></div>
    <div id="tab5" class="panel"></div>
    <div id="tab6" class="panel"></div>
    <div id="tab7" class="panel"></div>
    <div id="tab9" class="panel"></div>
    <div id="tab10" class="panel"></div>
    
    <!-- tab9 oculto -->
</div>

<div id="barcodeHiddenCanvas" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>

<script src="core.js"></script>
<script src="modulo1_procesar.js"></script>
<script src="modulo2_diferencias.js"></script>
<script src="modulo3_ubicaciones.js"></script>
<script src="modulo4_barras.js"></script>
<script src="modulo5_compensacion.js"></script>
<script src="modulo6_stock.js"></script>
<script src="modulo7_contenedores.js"></script>
<script src="modulo9_depurador_vr.js"></script>
<!-- modulo9_depurador_vr.js oculto -->
 <script src="modulo10_seccionador.js"></script>
<script src="main.js"></script>
</body>
</html>
